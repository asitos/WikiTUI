name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: wikid-${{ github.ref_name }}-x86_64-linux.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: wikid-${{ github.ref_name }}-aarch64-macos.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: wikid-${{ github.ref_name }}-x86_64-windows.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: package unix archive
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.archive_name }} -C target/${{ matrix.target }}/release wikid -C $GITHUB_WORKSPACE README.md LICENSE

      - name: package windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/wikid.exe, README.md, LICENSE -DestinationPath ${{ matrix.archive_name }}

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive_name }}

  publish:
    name: publish
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          body_path: RELEASE.md
      - uses: dtolnay/rust-toolchain@stable
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty
