[package]
name = "wikid"
version = "1.1.0"
edition = "2021"
authors = ["sharkthakftw"]
description = "feature-rich terminal wikipedia client"
license = "MIT"
repository = "https://github.com/sharkthakftw/wikid"
readme = "README.md"
keywords = ["wikipedia", "tui", "ratatui", "terminal", "reader"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.26.1"
crossterm = "0.27.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.18.1"
rand = "0.8"
unicode-width = "0.2.2"
chrono = "0.4"
