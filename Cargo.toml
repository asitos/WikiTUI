[package]
name = "wikid"
version = "1.5.0"
edition = "2021"
authors = ["sharkthakftw"]
description = "feature-rich terminal wikipedia client"
license = "MIT"
repository = "https://github.com/sharkthakftw/wikid"
readme = "README.md"
keywords = ["wikipedia", "tui", "ratatui", "terminal", "reader"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.26.1"
crossterm = "0.27.0"
tokio = { version = "1.35", default-features = false, features = ["rt", "sync", "time", "macros"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.18.1"
fastrand = "2.0"
unicode-width = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
